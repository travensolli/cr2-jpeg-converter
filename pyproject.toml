[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cr2-converter"
description = "Conversor desktop de arquivos Canon RAW (.CR2) para JPEG"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "PySide6>=6.5",
    "rawpy>=0.19",
    "Pillow>=10.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.24", "pyinstaller>=6.0"]

[project.gui-scripts]
cr2-converter = "cr2_converter.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cr2_converter.__version__" }

[tool.setuptools.packages.find]
include = ["cr2_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:cr2_converter.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # O projeto é escrito em português: travessões, reticências e aspas
    # tipográficas são intencionais nos textos exibidos ao usuário e nas
    # docstrings. Essas regras alertam sobre caracteres Unicode "ambíguos".
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Os testes acessam membros privados de propósito (saneamento de EXIF,
# estado da janela) e usam nomes em português.
"tests/*" = ["N802", "N803", "N806", "SLF001"]
